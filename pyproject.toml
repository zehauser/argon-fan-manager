[project]
name = "argon-fan-manager"
version = "0.1.0"
description = "Manage fan for Argon One V2 Raspberry Pi case (based on CPU temp)"
requires-python = ">=3.12"
dependencies = [
    "smbus2==0.6.1"
]

[project.scripts]
argon-fan-manager = "argon_fan_manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"